<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMind - Modo Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Modulo_2.css">
<link rel="stylesheet" href="progress.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-deco header-deco--tr" aria-hidden="true">
      <span class="deco-shape shape-1"></span>
      <span class="deco-shape shape-2"></span>
      <span class="deco-shape shape-3"></span>
    </div>

    <div class="brand">
      <img src="logo.png" alt="Logo SafeMind" class="brand-logo">
      <span class="brand-divider" aria-hidden="true"></span>
      <div class="brand-text">
        <h1 class="brand-title">Safe<span>Mind</span></h1>
        <p class="brand-subtitle">Ciberseguridad educativa</p>
      </div>
    </div>

    <div class="header-center">
      <h2 class="kids-mode-title">Modo Kids</h2>
    </div>

    <div class="header-right">
      <button type="button" class="btn-back" id="btnBack">
        <svg class="icon icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Regresar</span>
      </button>

    </div>
  </header>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="app-main">
    <div class="bg-dots" aria-hidden="true"></div>
    <div class="bg-deco bg-deco--bl" aria-hidden="true">
      <span class="deco-shape shape-b"></span>
      <span class="deco-shape shape-a"></span>
    </div>

    <section class="modules-row" aria-label="Módulos del curso">

      <article class="module-card" data-module="1" tabindex="0">
        <span class="module-number">01</span>
        <h3 class="module-title">Detective de contraseñas</h3>
      </article>

      <article class="module-card" data-module="2" tabindex="0">
        <span class="module-number">02</span>
        <h3 class="module-title">Apocalipsis de Contraseñas</h3>
      </article>

      <article class="module-card" data-module="3" tabindex="0">
        <span class="module-number">03</span>
        <h3 class="module-title">¿Amigo o Hacker?</h3>
      </article>

      <article class="module-card" data-module="4" tabindex="0">
        <span class="module-number">04</span>
        <h3 class="module-title">Superclave</h3>
      </article>

      <article class="module-card" data-module="5" tabindex="0">
        <span class="module-number">05</span>
        <h3 class="module-title">Defensor Estelar</h3>
      </article>

    </section>
  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="progreso.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>SafeMindProgress.initModulePage(2));</script>
<script src="Modulo_2.js"></script>
<script src="click-spark.js"></script>
</body>
</html>
