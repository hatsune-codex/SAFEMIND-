<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 1: El Radar de la Huella Digital</title>
  <style>
    :root {
      --bg-dark: #050811;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(56, 189, 248, 0.2);
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --neon-yellow: #ffb700;
      --text-bright: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12), transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(255, 0, 85, 0.08), transparent 50%);
      background-attachment: fixed;
    }

    /* CURSOR PERSONALIZADO SOBRE EL FEED */
    .feed-section {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="%2300f3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>') 18 18, pointer;
    }

    /* HEADER CYBERPUNK HUD */
    header {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 24px;
      position: sticky;
      top: 12px;
      z-index: 100;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .radar-icon {
      width: 22px;
      height: 22px;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      position: relative;
      animation: radarPulse 2s infinite linear;
    }
    .radar-icon::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 50%; height: 2px;
      background: var(--neon-cyan);
      transform-origin: 0% 0%;
      animation: radarSpin 1.5s infinite linear;
    }

    @keyframes radarSpin { 100% { transform: rotate(360deg); } }
    @keyframes radarPulse { 0%, 100% { box-shadow: 0 0 5px var(--neon-cyan); } 50% { box-shadow: 0 0 18px var(--neon-cyan); } }

    h1 {
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
      text-align: center;
    }

    .instructions {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    /* HUD METRICS */
    .hud-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    /* RISK METER */
    .meter-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-top: 4px;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow), var(--neon-red));
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* FEED DE RED SOCIAL */
    .feed-section {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 40px;
    }

    /* POST CARD */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 243, 255, 0.6);
      box-shadow: 0 12px 35px rgba(0, 243, 255, 0.2);
    }

    /* EFECTO LÁSER ESCÁNER HOVER */
    .post-card::before {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 243, 255, 0.05) 70%,
        rgba(0, 243, 255, 0.8) 98%,
        #00f3ff 100%
      );
      pointer-events: none;
      z-index: 5;
      opacity: 0;
    }

    .post-card:hover::before {
      opacity: 1;
      animation: laserScan 1.6s infinite ease-in-out;
    }

    @keyframes laserScan {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    /* GRID OVERLAY DE ESCANEO FUTURISTA */
    .post-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 4;
    }

    .post-card:hover::after {
      opacity: 1;
    }

    /* CABECERA PERFIL DE POST */
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), #7000ff);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      color: var(--neon-cyan);
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .username {
      font-size: 0.88rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .post-time {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .badge-tag {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(0, 243, 255, 0.1);
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 243, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* CONTENIDO VISUAL SIMULADO DE POST */
    .post-media {
      width: 100%;
      height: 200px;
      background: #090d16;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* GRAFICOS SVG ESTILIZADOS DENTRO DE LOS POSTS */
    .graphic-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ID CARD GRAPHIC */
    .id-card-graphic {
      width: 80%;
      height: 80%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--neon-cyan);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .id-photo {
      width: 60px;
      height: 70px;
      background: #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .id-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    .id-details strong { color: var(--neon-cyan); font-size: 0.8rem; }

    /* GPS LIVE GRAPHIC */
    .gps-graphic {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #080d1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .map-pin {
      font-size: 3rem;
      animation: bouncePin 1.2s infinite alternate ease-in-out;
    }
    @keyframes bouncePin { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
    .live-badge {
      background: var(--neon-red);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 0 12px var(--neon-red);
      animation: flash 1s infinite alternate;
    }
    @keyframes flash { 0% { opacity: 0.6; } 100% { opacity: 1; } }

    /* TICKET GRAPHIC */
    .ticket-graphic {
      width: 85%;
      height: 75%;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .ticket-info { display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; }
    .ticket-qr { width: 55px; height: 55px; background: #0f172a; border-radius: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; }
    .qr-pixel { background: white; border-radius: 1px; }

    /* KEYS GRAPHIC */
    .keys-graphic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-size: 3.5rem;
      filter: drop-shadow(0 0 15px rgba(255, 183, 0, 0.4));
    }

    /* FOOTER Y CAPTION DE POST */
    .post-footer {
      padding: 14px 16px;
    }

    .post-actions {
      display: flex;
      gap: 14px;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .post-caption {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* ANIMACIONES DE DETECCIÓN Y FEEDBACK */
    .post-card.correct {
      border: 2px solid var(--neon-green) !important;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5) !important;
      animation: pulseMatch 0.8s ease-out;
      cursor: default;
    }

    .post-card.correct::before {
      display: none;
    }

    .post-card.correct .badge-tag {
      background: rgba(0, 255, 102, 0.2);
      color: var(--neon-green);
      border-color: var(--neon-green);
    }

    .post-card.wrong {
      border: 2px solid var(--neon-red) !important;
      animation: glitchShake 0.4s ease-in-out;
    }

    @keyframes pulseMatch {
      0% { transform: scale(0.98); box-shadow: 0 0 0 rgba(0, 255, 102, 0.8); }
      50% { transform: scale(1.02); box-shadow: 0 0 40px rgba(0, 255, 102, 0.8); }
      100% { transform: scale(1); }
    }

    @keyframes glitchShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) skewX(2deg); box-shadow: 0 0 20px var(--neon-red); }
      40% { transform: translateX(10px) skewX(-2deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* TOAST BANNER DE ADVERTENCIA */
    .toast-alert {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
      border: 1px solid #f87171;
      backdrop-filter: blur(8px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 200;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-alert.active {
      transform: translateX(-50%) translateY(0);
    }

    /* MODAL DE RESULTADO */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
      border-radius: 20px;
      padding: 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: var(--neon-cyan);
    }

    .modal-body {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
      color: #050811;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      padding: 14px 22px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    }

    .btn-action.btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-bright);
      box-shadow: none;
    }

    .btn-action.btn-secondary:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }
  </style>
</head>
<body>

  <a href="Modulo_3.html" style="position:fixed;top:16px;left:16px;z-index:1000;padding:10px 14px;border:1px solid var(--neon-cyan);background:rgba(5,8,17,.92);color:var(--neon-cyan);font-weight:700;text-decoration:none;">&larr; REGRESAR</a>

  <!-- HEADER Y PANEL HUD -->
  <header>
    <div class="title-wrapper">
      <div class="radar-icon"></div>
      <h1>Radar de Huella Digital</h1>
    </div>
    <p class="instructions">Escanea el feed de @Alex_Cyber09. Detecta los <strong>4 datos sensibles</strong> expuestos.</p>

    <div class="hud-metrics">
      <div class="metric-box">
        <span class="metric-label">Datos Sensibles</span>
        <span class="metric-value"><span id="found-val">0</span> / 4</span>
      </div>
      <div class="metric-box">
        <span class="metric-label">Nivel de Riesgo</span>
        <span class="metric-value" id="risk-val-text">0%</span>
        <div class="meter-bar">
          <div class="meter-fill" id="risk-meter-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- FEED PRINCIPAL -->
  <main class="feed-section" id="feed-container"></main>

  <!-- TOAST DE ALERTA -->
  <div class="toast-alert" id="toast-alert">
    <span>⚠️</span>
    <span id="toast-text">Dato Seguro. ¡No representa una amenaza!</span>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <div class="modal-icon" id="modal-icon">🛡️</div>
      <h2 class="modal-title" id="modal-title">Escaneo Exitoso</h2>
      <div class="modal-body" id="modal-body">
        <!-- Texto inyectado por JS -->
      </div>
      <div class="modal-actions">
        <button class="btn-action btn-secondary" onclick="location.reload()">Reiniciar Nivel</button>
        <a href="modo_kids.html" class="btn-action" id="btn-next-module">Ir al Menú ➔</a>
      </div>
    </div>
  </div>

  <script>
    // SINTETIZADOR DE SONIDO WEB AUDIO API (EFECTOS DE SONIDO FUTURISTAS SIN ARCHIVOS EXTERNOS)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playScan() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      },
      playSuccess() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2); // G5
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      },
      playError() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    };

    // PUBLICACIONES DEL FEED (10 TOTAL: 4 SENSIBLES, 6 SEGURAS)
    const posts = [
      {
        id: 1,
        isSensitive: false,
        time: 'Hace 10 min',
        caption: '¡La mejor hamburguesa doble con queso de la ciudad! 🍔🤤 #Foodie #Dinner',
        renderGraphic: () => `<div class="graphic-container" style="font-size: 4rem;">🍔🍟</div>`
      },
      {
        id: 2,
        isSensitive: true,
        time: 'Hace 25 min',
        caption: '¡Al fin me entregaron la credencial oficial de la escuela! Miren lo bien que salí 😎',
        renderGraphic: () => `
          <div class="id-card-graphic">
            <div class="id-photo">🧑‍🎓</div>
            <div class="id-details">
              <strong>CARNET ESTUDIANTIL</strong>
              <span>Nombre: Alex Cruz</span>
              <span>Código: 2026-9942A</span>
              <span>Colegio Central</span>
            </div>
          </div>
        `
      },
      {
        id: 3,
        isSensitive: false,
        time: 'Hace 1 hora',
        caption: 'Un atardecer espectacular desde la ventana de mi cuarto 🌅✨',
        renderGraphic: () => `<div class="graphic-container" style="font-size: 4rem; background: linear-gradient(to top, #ff7e5f, #feb47b); width:100%;">🌅</div>`
      },
      {
        id: 4,

    // ESTADO
    let foundCount = 0;
    let riskLevel = 0;
    const TOTAL_SENSITIVE = 4;

    // DOM ELEMENTS
    const feedContainer = document.getElementById('feed-container');
    const foundValEl = document.getElementById('found-val');
    const riskValText = document.getElementById('risk-val-text');
    const riskMeterFill = document.getElementById('risk-meter-fill');
    const toastEl = document.getElementById('toast-alert');
    const modalBackdrop = document.getElementById('modal-backdrop');

    // RENDER FEED
    function buildFeed() {
      feedContainer.innerHTML = '';
      posts.forEach(post => {
        const card = document.createElement('article');
        card.className = 'post-card';
        card.dataset.id = post.id;

        card.innerHTML = `
          <div class="post-header">
            <div class="user-info">
              <div class="avatar-ring">
                <div class="avatar-inner">A</div>
              </div>
              <div class="user-details">
                <span class="username">@Alex_Cyber09</span>
                <span class="post-time">${post.time}</span>
              </div>
            </div>
            <span class="badge-tag">Post #${post.id}</span>
          </div>
          <div class="post-media">
            ${post.renderGraphic()}
          </div>
          <div class="post-footer">
            <div class="post-actions">❤️ 💬 ✈️</div>
            <p class="post-caption">${post.caption}</p>
          </div>
        `;

        card.addEventListener('mouseenter', () => AudioEngine.playScan());
        card.addEventListener('click', () => handleCardClick(card, post));

        feedContainer.appendChild(card);
      });
    }

    // CLICK HANDLER
    function handleCardClick(card, post) {
      if (card.classList.contains('correct')) return;

      if (post.isSensitive) {
        // ACIERTO
        AudioEngine.playSuccess();
        card.classList.add('correct');
        foundCount++;
        foundValEl.textContent = foundCount;

        if (foundCount === TOTAL_SENSITIVE) {
          triggerWin();
        }
      } else {
        // ERROR
        AudioEngine.playError();
        card.classList.add('wrong');
        setTimeout(() => card.classList.remove('wrong'), 500);

        triggerRiskIncrease();
        showToastAlert('⚠️ Publicación segura. ¡No contiene datos de riesgo!');
      }
    }

    // AUMENTAR RIESGO
    function triggerRiskIncrease() {
      if (riskLevel < 100) {
        riskLevel += 25;
        riskValText.textContent = `${riskLevel}%`;
        riskMeterFill.style.width = `${riskLevel}%`;

        if (riskLevel >= 100) {
          triggerGameOver();
        }
      }
    }

    // TOAST
    function showToastAlert(msg) {
      document.getElementById('toast-text').textContent = msg;
      toastEl.classList.add('active');
      setTimeout(() => toastEl.classList.remove('active'), 2200);
    }

    // VICTORIA
    function triggerWin() {
      SafeMindProgress.complete(3, 1);
      document.getElementById('modal-icon').textContent = '🛡️';
      document.getElementById('modal-title').textContent = '¡AMENAZAS NEUTRALIZADAS!';
      document.getElementById('modal-title').style.color = 'var(--neon-green)';
      document.getElementById('modal-body').innerHTML = `
        <strong style="color: var(--neon-cyan);">¡Excelente trabajo de ciberseguridad!</strong><br><br>
        Identificaste los 4 riesgos clave de la huella digital:<br>
        • <strong>Carnet Escolar:</strong> Revela nombre completo, código institucional y centro educativo.<br>
        • <strong>Ubicación en vivo:</strong> Permite el rastreo físico en tiempo real.<br>
        • <strong>Pase de abordar (QR):</strong> Los códigos QR de boletos almacenan datos personales clave.<br>
        • <strong>Foto de llaves:</strong> Permite clonar dientes de cerraduras con impresoras 3D.
      `;
      modalBackdrop.classList.add('active');
    }

    // GAMEOVER
    function triggerGameOver() {
      document.getElementById('modal-icon').textContent = '🚨';
      document.getElementById('modal-title').textContent = 'ALERTA DE SEGURIDAD';
      document.getElementById('modal-title').style.color = 'var(--neon-red)';
      document.getElementById('modal-body').innerHTML = `
        <strong style="color: var(--neon-red);">Nivel de Riesgo al 100%</strong><br><br>
        Has cometido demasiados errores de evaluación. La privacidad y seguridad de la cuenta de Alex ha sido compromised por no identificar a tiempo la información crítica expuesta.
      `;
      modalBackdrop.classList.add('active');
    }

    // INICIALIZACIÓN
    buildFeed();
  </script>
