<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMind - Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Poppins',sans-serif}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050816;background-image:radial-gradient(circle at top right,#4b24d3 0%,transparent 40%),radial-gradient(circle at bottom left,#00d4ff20 0%,transparent 45%);color:#fff}.card{width:min(420px,92vw);padding:38px;border-radius:24px;background:rgba(10,15,35,.9);border:2px solid #00d4ff55;box-shadow:0 0 40px rgba(0,212,255,.2);text-align:center}.logo{font-size:38px;font-weight:700;margin-bottom:6px}.logo span{color:#00d4ff}.sub{color:#c8d3ff;margin-bottom:28px;font-size:14px}input{width:100%;height:54px;margin-bottom:15px;border:2px solid #00d4ff;border-radius:30px;background:transparent;padding:0 18px;color:#fff;font-size:16px;outline:none}button{width:100%;height:56px;border:0;border-radius:30px;background:linear-gradient(90deg,#00d4ff,#00a8ff);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 0 20px #00d4ff55}#status{min-height:42px;margin-top:16px;color:#ffbd45;font-size:13px}.back{display:inline-block;margin-top:10px;color:#00d4ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Safe<span>Mind</span></div>
  <div class="sub">CREAR NUEVA CONTRASEÑA</div>

  <form id="resetForm">
    <input id="newPassword" type="password" minlength="6" placeholder="Nueva contraseña" required>
    <input id="confirmPassword" type="password" minlength="6" placeholder="Confirmar contraseña" required>
    <button type="submit">Guardar nueva contraseña</button>
  </form>

  <p id="status">Abre esta página desde el enlace enviado a tu correo.</p>
  <a class="back" href="login.html">Volver al inicio de sesión</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const form = document.getElementById("resetForm");
const statusEl = document.getElementById("status");
let recoveryReady = false;

function setStatus(message, ok=false){
  statusEl.textContent = message;
  statusEl.style.color = ok ? "#00ff99" : "#ffbd45";
}

async function revisarSesion(){
  if (!window.supabaseClient) {
    setStatus("No se pudo conectar con Supabase.");
    return;
  }

  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) {
    recoveryReady = true;
    setStatus("Enlace válido. Escribe tu nueva contraseña.", true);
  }
}

window.supabaseClient?.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" || session) {
    recoveryReady = true;
    setStatus("Enlace válido. Escribe tu nueva contraseña.", true);
  }
});

revisarSesion();

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (password.length < 6) return setStatus("La contraseña debe tener al menos 6 caracteres.");
  if (password !== confirm) return setStatus("Las contraseñas no coinciden.");

  if (!recoveryReady) {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) return setStatus("El enlace de recuperación no es válido o ya expiró. Solicita uno nuevo.");
  }

  setStatus("Actualizando contraseña...");
  const { error } = await window.supabaseClient.auth.updateUser({ password });

  if (error) return setStatus("Error: " + error.message);

  setStatus("Contraseña actualizada correctamente. Volviendo al inicio de sesión...", true);
  await window.supabaseClient.auth.signOut();
  setTimeout(() => { window.location.href = "login.html"; }, 1400);
});
</script>
</body>
</html>
